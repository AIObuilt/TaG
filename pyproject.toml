[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tag-governance"
version = "0.1.0"
description = "TaG: source-available trust and governance for agentic execution."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-BSL-1.1"
authors = [
  { name = "Vance", email = "vance@aiobuilt.com" }
]
keywords = ["agents", "governance", "security", "trust", "routing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/AIObuilt/TaG"
Repository = "https://github.com/AIObuilt/TaG"

[tool.hatch.build.targets.wheel]
packages = ["tag"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/LICENSE",
  "/SECURITY.md",
  "/CHANGELOG.md",
  "/pyproject.toml",
  "/tag",
  "/agent-enforcement",
  "/tag_config.py",
]
